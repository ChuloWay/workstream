format_version = 1
id = "runtime-integration-qualification"
title = "Qualify bounded reference and recovery trials"

[environment]
dockerfile = "environment/Dockerfile"
context = "."
platform = "linux/amd64"

[reference]
command = ["sh", "solution/apply.sh"]
working_directory = "."

[verification]
command = ["sh", "tests/run.sh"]
working_directory = "."

[resources]
cpu_millis = 1000
memory_bytes = 134217728
disk_bytes = 134217728
build_timeout_seconds = 30
reference_timeout_seconds = 10
verification_timeout_seconds = 10
