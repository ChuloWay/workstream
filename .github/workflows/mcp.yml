name: MCP Foundation

on:
  workflow_call:

concurrency:
  group: mcp-foundation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Bind exact checked-out tree
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test -z "$(git status --porcelain)"
          test "$(git rev-parse "${GITHUB_SHA}^{tree}")" = "$(git rev-parse HEAD^{tree})"

      - name: Install locked package tooling
        run: python -m pip install "uv==0.10.7"

      - name: Lint, type-check, test, and build the adapter
        working-directory: mcp_server
        shell: bash
        run: |
          set -euo pipefail
          uv sync --frozen --extra dev
          uv run --frozen ruff check workstream_mcp tests
          uv run --frozen mypy workstream_mcp
          uv run --frozen pytest -q --ignore=tests/integration --cov=workstream_mcp --cov-report=term-missing
          uv build --wheel --out-dir dist

      - name: Prove wheel independence from backend source
        working-directory: mcp_server
        shell: bash
        run: |
          set -euo pipefail
          python -m venv "${RUNNER_TEMP}/workstream-mcp-wheel"
          "${RUNNER_TEMP}/workstream-mcp-wheel/bin/pip" install --upgrade pip
          "${RUNNER_TEMP}/workstream-mcp-wheel/bin/pip" install dist/*.whl
          WORKSTREAM_MCP_WHEEL_PYTHON="${RUNNER_TEMP}/workstream-mcp-wheel/bin/python" \
            uv run --frozen pytest -q tests/test_package_independence.py

      - name: Build and run the independent container
        shell: bash
        run: |
          set -euo pipefail
          image="workstream-mcp-foundation:${GITHUB_SHA}"
          docker build --tag "${image}" mcp_server
          docker run --detach --rm --name workstream-mcp-foundation \
            --publish 127.0.0.1:18080:8080 \
            --env WORKSTREAM_API_URL=http://127.0.0.1:9 \
            "${image}"
          trap 'docker logs workstream-mcp-foundation; docker stop workstream-mcp-foundation' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error \
              --header 'Accept: application/json, text/event-stream' \
              --header 'Content-Type: application/json' \
              --data '{"jsonrpc":"2.0","id":1,"method":"tools/list","params":{}}' \
              http://127.0.0.1:18080/mcp \
              | python -c 'import json, sys; tools = [tool["name"] for tool in json.load(sys.stdin)["result"]["tools"]]; assert len(tools) == len(set(tools)) == 90; assert tools[-43:] == ["workstream_project_guides_list", "workstream_project_guide_get", "workstream_guide_activate", "workstream_guide_activation_readiness_get", "workstream_guide_proposal_correct", "workstream_guide_correction_dispatch", "workstream_guide_post_policy_get", "workstream_guide_post_policy_approve", "workstream_guide_post_policy_correct", "workstream_guide_pre_submission_approve", "workstream_guide_proposal_get", "workstream_guide_document_upload", "workstream_guide_document_content_get", "workstream_guide_effective_submission_artifact_policy_get", "workstream_guide_pre_submit_checker_policy_get", "workstream_guide_setup_latest_get", "workstream_guide_submission_artifact_policies_list", "workstream_guide_submission_artifact_policy_create", "workstream_guide_submission_artifact_policy_get", "workstream_guide_submission_artifact_policy_update", "workstream_guide_sufficiency_reports_list", "workstream_guide_sufficiency_report_create", "workstream_guide_sufficiency_report_get", "workstream_guide_sufficiency_warnings_acknowledge", "workstream_submission_checker_runs_list", "workstream_submission_checker_runs_get", "workstream_project_checker_runs_list", "workstream_project_checker_runs_get", "workstream_checker_retry_sources_list", "workstream_checker_runs_retry", "workstream_post_submit_deliveries_list", "workstream_post_submit_deliveries_reconcile", "workstream_checker_registry_read", "workstream_checker_registry_register", "workstream_artifact_readiness_get", "workstream_artifact_bindings_list", "workstream_artifact_replicas_list", "workstream_artifact_receipts_list", "workstream_artifact_verification_job_get", "workstream_artifact_verification_job_retry", "workstream_artifact_recovery_attempt_get", "workstream_artifact_admission_usage_get", "workstream_artifact_audit_events_list"]'; then
              exit 0
            fi
            sleep 1
          done
          exit 1

  real-api-contract:
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: docker.io/library/postgres:16@sha256:33f923b05f64ca54ac4401c01126a6b92afe839a0aa0a52bc5aeb5cc958e5f20
        env:
          POSTGRES_DB: workstream_test
          POSTGRES_USER: workstream
          POSTGRES_PASSWORD: workstream
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U workstream -d workstream_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Bind exact checked-out tree
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test -z "$(git status --porcelain)"
          test "$(git rev-parse "${GITHUB_SHA}^{tree}")" = "$(git rev-parse HEAD^{tree})"

      - name: Install backend and adapter test environments
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install "uv==0.10.7"
          uv lock --check --project backend
          uv sync --frozen --extra agents --extra dev --project backend
          cd mcp_server
          uv sync --frozen --extra dev
          uv build --wheel --out-dir dist
          python -m venv "${RUNNER_TEMP}/workstream-mcp-wheel"
          "${RUNNER_TEMP}/workstream-mcp-wheel/bin/pip" install --upgrade pip
          "${RUNNER_TEMP}/workstream-mcp-wheel/bin/pip" install dist/*.whl

      - name: Compare selected OpenAPI contract
        working-directory: mcp_server
        shell: bash
        run: |
          set -euo pipefail
          export WORKSTREAM_MCP_OPENAPI_COMMAND="uv run --frozen python -c 'import json; from app.main import app; print(json.dumps(app.openapi()))'"
          uv run --frozen pytest -q tests/test_contract_drift.py

      - name: Run real isolated API-to-MCP lifecycle parity
        working-directory: backend
        env:
          WORKSTREAM_MCP_EXECUTABLE: ${{ runner.temp }}/workstream-mcp-wheel/bin/workstream-mcp
          WORKSTREAM_TEST_ADMIN_DATABASE_URL: postgresql+asyncpg://workstream:workstream@localhost:5433/postgres
        shell: bash
        run: |
          set -euo pipefail
          for suite in test_profile_flow test_access_reads test_admin_grants test_actor_lifecycle test_projects test_project_grants test_guides test_policies; do
            uv run --frozen python scripts/run_isolated_tests.py \
              --metadata-json "${RUNNER_TEMP}/workstream-mcp-${suite}-evidence.json" \
              --timeout-seconds 240 \
              -- uv run --frozen --project ../mcp_server python -m pytest -q "../mcp_server/tests/integration/${suite}.py"
          done
